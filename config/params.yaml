# config/params.yaml

global:
  # 패키지 외부의 데이터 저장소 경로. 홈 디렉토리에 있음.
  workspace_root: "~/dae_floor_maps"

# ==============================================================================
# [1. Mission Generation - Environment Modeling Component]
# ==============================================================================
environment_modeling:
  # [Global Settings]
  target_resolution: 0.02 # 맵의 해상도 (meter/pixel). 값이 작을수록 정밀하지만 계산량이 증가.
  dae_file: "INU_9_211.dae" # 분석 대상 3D 모델 파일명. (INU_9_211.dae, Apt.dae) 파일명 바꾸고 난 이후, coverage_flatness_env.world에서도 바꿀 것.

  # [Strict Directory Mappings]
  input_dir: "assets"
  output_grid_dir: "maps/grid"           # 2D OGM (.yaml, .pgm) 저장 경로
  output_topology_dir: "maps/topology"   # 공간 분할 Topological Graph (.npz) 저장 경로
  visualization_dir: "visualization/mission_generation/environment_modeling" # 디버깅 이미지
  
  # [Robot & Environment Constraints]
  robot_width: 0.15 # (m) 로봇 반경. 시각화에서 핑크 구역은 robot_width만 깎아낸 것임
  max_door_radius: 0.5 # 일반적인 방의 문 폭의 최대 너비의 절반: 1.0 / 2 = 0.5 (m)
  min_area_px: 100 # 분할된 조각이 너무 작아지는 것 방지.
  max_aspect_ratio: 8 # 공간의 최대 종횡비의 기준. 예를 들어 공간의 종횡비가 5 이상이라면, 지나치게 긴 공간으로 간주하여 분할함.

  # [Recursive Convexity Decomposition]
  # 공간의 convexity을 기준으로 L자, U자형 공간을 사각형에 가깝게 분할하는 로직
  convexity: 
    # 1. 분할 실행 임계값
    base_solidity_threshold: 0.84   # 기본 분할 기준 (Solidity). 1.0에 가까울수록 엄격하게(더 많이) 분할함.
    strict_solidity_threshold: 0.75 # 강제 분할 기준. 볼록성이 이 수치 미만이면 병목이 작아도 무조건 분할 시도.
    l_shape_ratio_threshold: 0.85   # (최소폭 / 평균폭)값이 이 값보다 작으면 L자 코너로 판단.
    
    # 2. Projection 분석 파라미터
    projection_margin_ratio: 0.1    # Projection 분석 시 무시할 양 끝단 비율. 0.1은 양쪽 10%씩 제외하고 중앙 80%에서 절단점 탐색.
    bottleneck_tolerance_ratio: 1.05 # 병목 구간 인정 오차 범위. 최솟값의 105% 이내 픽셀들을 모두 최적 절단 후보군으로 설정.
    
    # 3. 마스크 복원 및 필터링 (Dilation)
    # 절단된 노드들에 인접한 벽면 데이터를 안전하게 빠짐없이 배분하기 위한 설정
    dilation_kernel_size: 5         # 벽면 탐색을 위한 커널 크기 (pixel). 해상도가 높을수록 키우는 것을 권장.
    dilation_padding_px: 10         # 노드 확장 시의 추가 여유분 (pixel). 노드 크기의 절반 + 이 값만큼 확장하여 벽면 데이터를 수집함.

# ==============================================================================
# [2. Mission Generation - Mission Planning Component]
# ==============================================================================
mission_planner:
  lidar_vertical_fov_deg: 15.0 # 수직 FOV 절반
  lidar_mount_height: 0.338 # (m) base_footprint(지면) 기준 velodyne_link 높이. 실측하여 정확한 값을 기입바람.
  path_safety_margin: 0.25 # robot_width + path_safety_margin 만큼 경로가 벽에서 떨어져서 생성되도록 함.
  # (2026-09-11) 0.20 -> 0.25로 상향: local_costmap의 inflation_radius(0.25m, tb3_waffle_nav2_params.yaml)보다
  # 여유가 부족하면, 벽 근접 지점에서 제자리 회전(Spin) 시 사전 충돌 체크에 걸려 실패하는 문제가 실측에서 확인됨.

  lidar_range: 3.0 # 라이다 측정 최대 범위 (m)
  overlap: 0.2 # 이동하면서 측정 시 오버랩할 비율
  
  # [Strict Directory Mappings]
  output_metric_dir: "analytics/metrics" # 생성된 최종 웨이포인트 (.json) 저장 경로
  visualization_dir: "visualization/mission_generation/mission_planning"

  turn_weight: 2.0
  wall_weight: 12.0

  # [Ablation 실험용 토글] 연구 기여점 정량 비교를 위해 각 메커니즘을 개별
  # on/off 가능하게 함(paper.md 결론, 2026-09-03). boundary repass는
  # mission_execution.enable_boundary_repass로 이미 토글 가능함.
  enable_pendant_reorder: true       # false면 Step2.5 허브-pendant 재정렬 생략(Christofides 순서 그대로)
  enable_entry_hint_ordering: true   # false면 노드 내 스와스 순서가 진입/진출 방향과 무관하게 고정됨
  enable_path_simplification: true   # false면 A* transit 경로의 계단현상 제거(Douglas-Peucker)를 생략

# ==============================================================================
# [3. Mission Execution - Robot Driving & Tracking Component]
# ==============================================================================
mission_execution:
  # [Strict Directory Mappings]
  input_metric_dir: "analytics/metrics"  # 주행을 위해 읽어올 미션 웨이포인트 (.json) 경로
  output_path_dir: "analytics/paths"     # 계획 경로 및 실주행 경로 비교 데이터 (.csv) 저장 경로
  visualization_dir: "visualization/mission_execution"

  post_localization_wait_sec: 3.0

  coverage_angular_dist_threshold: 0.780   # coverage 구간 - yaml 기본값과 동일(정밀 회전 유지)
  transit_angular_dist_threshold: 3.140    # transit 구간 - 사실상 강제 회전 비활성화

  active_capture_seconds: 2.0
  min_rotation_deg: 3.0          # 이 이하 각도차는 회전 생략
  spin_time_allowance_sec: 15.0
  tf_lookup_retry_sec: 1.0       # map->base_link TF 조회 실패 시 재시도할 최대 시간(초). 버퍼/리스너 생성 직후처럼 TF 이력이 아직 얕을 때의 일시적 ExtrapolationException을 흡수함.

  direction_change_threshold_deg: 30.0 # 좁은 구역 측정 문제를 해결하기 위해 coverage/transit 무시함. 전체 경로를 대상으로, 30도 이상 방향이 바뀌는 지점으로 분할.

  # [Boundary Repass] 모든 coverage exit 지점(중간 노드 exit + 미션의 진짜
  # 마지막 지점)은 "멀어짐" 방향 시야가 구조적으로 보장되지 않아 blind cone이
  # 한쪽만 메워짐(utils/boundary_repass.py 참고). 미션의 진짜 첫 지점은
  # "접근" 방향 시야가 아예 없어 별도로 run_start_prepass가 보완함.
  # blind cone이 없는 센서로 교체되면 false로 꺼서 완전히 비활성화 가능.
  enable_boundary_repass: true
  boundary_repass_distance_m: 3.0   # 왕복 거리 (m). blind_radius_m(약 1.26m)의 약 2배 이상 필요함이 2026-09-01 실주행 히트맵 육안 확인으로 재확인됨(1.5m로는 부족, 2026-08-25 최초 관찰 반영). 세그먼트가 이보다 짧으면 자동으로 세그먼트 길이에 맞춰 clamp됨.

  # [Stall Logging] nav2 goToPose/goThroughPoses/Spin feedback을 blocking 대기
  # 루프 안에서 계속 폴링해, 진행 지표(distance_remaining/angular_distance_traveled)가
  # stall_log_threshold_sec 이상 전혀 바뀌지 않는 구간을 "지연"으로 기록함.
  # 미션이 끝나면(성공/실패/취소 무관) 그 목록만 stall_log_dir에 CSV로 따로
  # 저장된다(utils/stall_logger.py) - 다른 로그와 섞이지 않아 디버깅이 쉬움.
  stall_log_threshold_sec: 5.0
  stall_log_dir: "analytics/logs"

  # [Drive Debug Log] 미션 실행마다 새 파일(drive_debug_<날짜-시간>.csv)을
  # drive_debug_log_dir에 만들어, drive_debug_interval_sec 간격으로 "그 시점에 로봇이 정확히 뭘 하고
  # 있었는지"(현재 context - coverage 노드 id / transit 출발-도착 노드 /
  # prepass / end repass, 현재 TF pose, 활성 nav2 액션과 진행 지표, recoveries
  # 발동 횟수)를 계속 남김. drive_debug_stall_threshold_sec 이상 진행이 없으면
  # 그 구체적 원인 1차 진단(utils/mission_logger.py._build_stall_reason)까지
  # 같은 줄에 덧붙임. stall_log_dir의 사후 요약(stall_report_*.csv)과 달리
  # 미션 도중 실시간으로 계속 쌓여서, 프로세스가 중간에 죽어도 그때까지 기록이
  # 남음. 벽 근접이 아닌 "방 한복판"에서 멈추는 사례처럼 원인이 불분명할 때를
  # 위해 2026-09-11 도입.
  drive_debug_log_dir: "analytics/logs"
  drive_debug_interval_sec: 3.0
  drive_debug_stall_threshold_sec: 9.0

  # [Spin Retry] boundary_repass 지점처럼 벽에 바짝 붙은 자리에서 Spin의 사전
  # 충돌 체크(behavior_server의 simulate_ahead_time, tb3_waffle_nav2_params.yaml)에
  # 걸려 즉시 실패하는 경우, 살짝 후진(BackUp)해 여유를 만든 뒤 1회만 재시도함
  # (_rotate_in_place_to/_backup_for_clearance, 2026-09-11 실측 도입).
  spin_retry_backup_dist_m: 0.15
  spin_retry_backup_speed_mps: 0.05
  backup_time_allowance_sec: 10.0

  # [Direct cmd_vel Rotate - 최종 폴백] Spin 1차 시도 + (후진 후) 재시도까지
  # 실패하면(혹은 후진 자체도 막히면), nav2 behavior_server를 아예 거치지 않고
  # /cmd_vel을 직접 발행해 제자리 회전시킴 - costmap 사전 충돌 체크를 하지
  # 않으므로 느린 속도로만 사용함(2026-09-11 도입, _direct_cmd_vel_rotate).
  direct_rotate_speed_rad_s: 0.3
  direct_rotate_timeout_sec: 20.0

# ==============================================================================
# [4. Surface Profiling - 3D Measurement & Evaluation Component]
# ==============================================================================
surface_profiling:
  # [Strict Directory Mappings]
  pointcloud_dir: "analytics/pointclouds"  # 로우 PCD 및 정렬/필터링된 바닥면 수치 데이터 저장 경로
  visualization_dir: "visualization/surface_profiling" # 최종 평탄도 히트맵 이미지 (.png) 저장 경로
  map_yaml_dir: "maps/grid"

  # [ROS2 Topic & TF Settings]
  pcd_topic_sim: "/velodyne_points"   # Gazebo 시뮬레이션 환경에서의 3D 라이다 토픽
  pcd_topic_real: "/velodyne_points"  # 실제 Velodyne VLP-16 하드웨어 토픽
  target_frame: "map"              # TF lookup 목표 좌표계 (전역 좌표계)
  source_frame: "velodyne_link"    # TF lookup 원본 좌표계 (3D 라이다 센서 좌표계)
  tf_timeout_sec: 0.5              # TF lookup 허용 대기 시간 (초). Chrony 시간 동기화 정밀도에 의존함.

  only_capture_at_waypoints: true
  enable_tf_lowpass_filter: true
  tf_lowpass_max_linear_vel: 0.3       # m/s
  tf_lowpass_max_angular_vel_deg: 20.0  # deg/s

  # [Point Cloud Processing]
  voxel_size: 0.01      # (m) PCD 저장 시 다운샘플링 단위. 메모리 초과 방지용.
  z_min: 0.000         # (m) -0.5cm, 필요에 따라 수정.
  z_max: 0.035          # (m) 3.5cm, 필요에 따라 수정.

  # [Heatmap Visualization]
  grid_size: 0.01        # (m) 히트맵 격자 크기. 작을수록 선명하지만 계산량 증가.
